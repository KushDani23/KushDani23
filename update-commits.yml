name: Update Latest Commits

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay scheduled runs a bit)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build the latest commits table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime

          OWNER = "KushDani23"
          REPOS = ["Mail-Insight", "ClaimFlow", "TestPilotAI"]
          LIMIT = 5

          token = os.environ["GH_TOKEN"]
          items = []

          for repo in REPOS:
              url = f"https://api.github.com/repos/{OWNER}/{repo}/commits?per_page={LIMIT}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              })
              try:
                  with urllib.request.urlopen(req) as r:
                      data = json.load(r)
              except Exception as e:
                  print(f"Skipping {repo}: {e}")
                  continue
              for c in data:
                  msg = c["commit"]["message"].splitlines()[0].strip()
                  msg = re.sub(r"[\[\]|`]", "", msg)
                  if len(msg) > 70:
                      msg = msg[:67] + "..."
                  items.append((c["commit"]["author"]["date"], repo, msg, c["html_url"]))

          items.sort(reverse=True)

          rows = ["| Date | Project | Commit |", "|:--|:--|:--|"]
          for date, repo, msg, link in items[:LIMIT]:
              d = datetime.strptime(date, "%Y-%m-%dT%H:%M:%SZ").strftime("%d %b %Y")
              rows.append(f"| {d} | [{repo}](https://github.com/{OWNER}/{repo}) | [{msg}]({link}) |")
          table = "\n".join(rows)

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"(<!--LATEST_COMMITS:START-->)(.*?)(<!--LATEST_COMMITS:END-->)"
          if not re.search(pattern, readme, flags=re.S):
              raise SystemExit("Markers not found in README.md")

          new = re.sub(pattern, lambda m: f"{m.group(1)}\n{table}\n{m.group(3)}", readme, flags=re.S)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update latest commits"
            git push
          fi
